apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
  labels:
    app: hazard-portal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hazard-portal
  template:
    metadata:
      labels:
        app: hazard-portal
    spec:
      containers:
      - name: portal-container
        image: municipalcorp/road-hazard-portal:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: hazard-portal
